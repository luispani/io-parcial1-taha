</script>
  <script>
/* IO.Simplex — exact-arithmetic simplex engine (tableau method, Taha 9a ed.)
 * Global: IO.Simplex = { parse, solve, sensitivity, toHTML }
 * Depends on global Frac (js/lib/frac.js). No ES modules, no external deps.
 *
 * Internal representation:
 *  - Constraint-row coefficients are plain Frac (m x (numVars+1), last col = RHS).
 *  - The "z-row" (reduced-cost row, in the canonical form  z - sum c_j x_j (+/- M R) = 0)
 *    is a row of "Num" pairs {c: Frac, m: Frac} representing  c + m*M .
 *    Only artificial-variable bookkeeping ever introduces a nonzero m part;
 *    constraint rows never carry an M term, which keeps pivoting simple:
 *    row/row operations are plain Frac, and the z-row is updated with
 *    Num = Num - Num*Frac operations.
 */
(function (global) {
  'use strict';
  var F = global.Frac;

  // ---------- Num (c + m*M) helpers ----------
  function N(c, m) { return { c: F.from(c), m: F.from(m === undefined ? 0 : m) }; }
  function nAdd(a, b) { return N(a.c.add(b.c), a.m.add(b.m)); }
  function nSub(a, b) { return N(a.c.sub(b.c), a.m.sub(b.m)); }
  function nNeg(a) { return N(a.c.neg(), a.m.neg()); }
  function nMulF(a, f) { f = F.from(f); return N(a.c.mul(f), a.m.mul(f)); }
  function nCmp(a, b) { var mc = a.m.cmp(b.m); if (mc !== 0) return mc; return a.c.cmp(b.c); }
  function nIsZero(a) { return a.c.isZero() && a.m.isZero(); }
  var NZERO = N(0, 0);
  function nToHTML(num) {
    var hasM = !num.m.isZero();
    if (!hasM) return num.c.toHTML();
    var parts = [];
    if (!num.c.isZero()) parts.push(num.c.toHTML());
    var mAbs = num.m.abs();
    var mStr = (mAbs.d === 1 && mAbs.n === 1) ? 'M' : (mAbs.toHTML() + 'M');
    if (parts.length === 0) {
      parts.push((num.m.isNeg() ? '−' : '') + mStr);
    } else {
      parts.push(num.m.isNeg() ? '−' : '+', mStr);
    }
    return parts.join(' ');
  }

  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  // ---------- parse ----------
  function parse(spec) {
    var type = spec.type === 'min' ? 'min' : 'max';
    var n = spec.c.length;
    var baseNames = (spec.varNames && spec.varNames.length === n) ? spec.varNames.slice() : range(n).map(function (i) { return 'x' + (i + 1); });
    var signs = spec.signs || null; // array length n: 'pos' | 'free' | 'neg'

    var colNames = [];
    var colCost = [];
    var colOrigIndex = [];
    var freeMap = {}; // origIndex -> {pos, neg}
    for (var i = 0; i < n; i++) {
      var sgn = signs ? (signs[i] || 'pos') : 'pos';
      var ci = F.from(spec.c[i]);
      if (sgn === 'free') {
        var p = colNames.length; colNames.push(baseNames[i] + '⁺'); colCost.push(ci); colOrigIndex.push(i);
        var q = colNames.length; colNames.push(baseNames[i] + '⁻'); colCost.push(ci.neg()); colOrigIndex.push(i);
        freeMap[i] = { pos: p, neg: q };
      } else if (sgn === 'neg') {
        var idxN = colNames.length; colNames.push(baseNames[i]); colCost.push(ci.neg()); colOrigIndex.push(i);
        freeMap[i] = { neg: idxN };
      } else {
        var idxP = colNames.length; colNames.push(baseNames[i]); colCost.push(ci); colOrigIndex.push(i);
        freeMap[i] = { pos: idxP };
      }
    }
    var nDecision = colNames.length;
    var m = spec.constraints.length;

    var baseRows = [];
    for (var r = 0; r < m; r++) {
      var con = spec.constraints[r];
      var row = new Array(nDecision);
      for (var k = 0; k < nDecision; k++) row[k] = F.ZERO;
      for (i = 0; i < n; i++) {
        var a = F.from(con.a[i] || 0);
        if (a.isZero()) continue;
        var map = freeMap[i];
        if (map.pos !== undefined) row[map.pos] = row[map.pos].add(a);
        if (map.neg !== undefined) row[map.neg] = row[map.neg].add(a.neg());
      }
      var b = F.from(con.b);
      var op = con.op;
      if (b.isNeg()) {
        row = row.map(function (x) { return x.neg(); });
        b = b.neg();
        if (op === '<=') op = '>='; else if (op === '>=') op = '<=';
      }
      baseRows.push({ row: row, b: b, op: op });
    }

    // Determine extra columns per row, appended after all decision columns.
    var extraInfo = [];
    var colIdx = nDecision;
    for (r = 0; r < m; r++) {
      var op2 = baseRows[r].op;
      var info = {};
      if (op2 === '<=') {
        info.slack = colIdx; colNames.push('s' + (r + 1)); colCost.push(F.ZERO); colIdx++;
      } else if (op2 === '>=') {
        info.surplus = colIdx; colNames.push('e' + (r + 1)); colCost.push(F.ZERO); colIdx++;
        info.art = colIdx; colNames.push('R' + (r + 1)); colCost.push(F.ZERO); colIdx++;
      } else { // '='
        info.art = colIdx; colNames.push('R' + (r + 1)); colCost.push(F.ZERO); colIdx++;
      }
      extraInfo.push(info);
    }
    var totalCols = colIdx;
    var rows = [];
    var bArr = [];
    var basisInit = [];
    var artificialCols = [];
    for (r = 0; r < m; r++) {
      var full = new Array(totalCols);
      for (k = 0; k < totalCols; k++) full[k] = F.ZERO;
      for (k = 0; k < nDecision; k++) full[k] = baseRows[r].row[k];
      var info2 = extraInfo[r];
      if (info2.slack !== undefined) { full[info2.slack] = F.ONE; basisInit.push(info2.slack); }
      if (info2.surplus !== undefined) full[info2.surplus] = F.ONE.neg();
      if (info2.art !== undefined) {
        full[info2.art] = F.ONE;
        artificialCols.push(info2.art);
        if (info2.slack === undefined) basisInit.push(info2.art);
      }
      rows.push(full);
      bArr.push(baseRows[r].b);
    }
    var cRowFull = new Array(totalCols);
    for (k = 0; k < totalCols; k++) cRowFull[k] = k < nDecision ? colCost[k] : F.ZERO;

    return {
      type: type,
      varNames: colNames,
      numVars: totalCols,
      nDecision: nDecision,
      colOrigIndex: colOrigIndex,
      freeMap: freeMap,
      cRow: cRowFull,
      rows: rows,
      b: bArr,
      basisInit: basisInit,
      artificialCols: artificialCols,
      hasArtificial: artificialCols.length > 0,
      m: m
    };
  }

  // ---------- generic tableau engine ----------
  function cloneRows(rows) { return rows.map(function (row) { return row.slice(); }); }

  // Direct z-row (reduced cost row, Zj - Cj convention): Zj = cB . column_j, z-row = Zj - Cj.
  // Optimality: max -> all >= 0 (enter most negative); min -> all <= 0 (enter most positive).
  // Recomputed from scratch every time (rows/b/basis/costFull) instead of tracked incrementally,
  // which keeps the Big-M / two-phase bookkeeping free of sign-accumulation bugs.
  function computeZRow(rows, b, basis, costFull) {
    var n = costFull.length, m = rows.length;
    var cB = basis.map(function (col) { return costFull[col]; });
    var z = new Array(n);
    for (var j = 0; j < n; j++) {
      var acc = NZERO;
      for (var i = 0; i < m; i++) acc = nAdd(acc, nMulF(cB[i], rows[i][j]));
      z[j] = nSub(acc, costFull[j]);
    }
    var z0 = NZERO;
    for (i = 0; i < m; i++) z0 = nAdd(z0, nMulF(cB[i], b[i]));
    return { z: z, zRHS: z0 };
  }

  function fmtFrac(f) { return f.toHTML(); }

  function noteEnter(varNames, col, val, type, ruleUsed) {
    if (ruleUsed === 'bland') {
      return 'Regla de Bland (anticiclado): entra ' + varNames[col] + ' por ser la de menor índice con coeficiente ' +
        (type === 'max' ? 'negativo' : 'positivo') + ' en la fila z que todavía permite mejorar ' +
        (type === 'max' ? 'el máximo' : 'el mínimo') + ' (coeficiente ' + val + '). Se activa para evitar que el método cicle.';
    }
    return 'Entra ' + varNames[col] + ' (regla de Dantzig: el coeficiente ' +
      (type === 'max' ? 'más negativo' : 'más positivo') + ' en la fila z; coeficiente ' + val + ').';
  }

  // Entering-column selection strategies.
  // Dantzig: the coefficient with the strongest improvement (most negative in
  // max, most positive in min); ties keep the lowest column index. This is
  // the rule used by Taha's textbook and in class, so the tableau sequence
  // matches what students see there — but it can cycle on degenerate models.
  function pickEnterDantzig(z, n, enterMask, type) {
    var bestCol = -1, bestVal = null;
    for (var j = 0; j < n; j++) {
      if (!enterMask[j]) continue;
      var val = z[j];
      var improves = type === 'max'
        ? (val.m.isNeg() || (val.m.isZero() && val.c.isNeg()))
        : (val.m.isPos() || (val.m.isZero() && val.c.isPos()));
      if (!improves) continue;
      if (bestCol === -1) { bestCol = j; bestVal = val; continue; }
      var cmp = nCmp(val, bestVal);
      var better = type === 'max' ? cmp < 0 : cmp > 0;
      if (better) { bestCol = j; bestVal = val; }
    }
    return bestCol === -1 ? null : { col: bestCol, val: bestVal };
  }

  // Bland: the smallest-index variable whose reduced cost still improves the
  // objective. Proven to terminate in finitely many iterations and never
  // cycles (see MEJORAS-PENDIENTES.md §2.2). Used as the anti-cycling
  // fallback for the 'auto' rule, or directly when the caller asks for it.
  function pickEnterBland(z, n, enterMask, type) {
    for (var j = 0; j < n; j++) {
      if (!enterMask[j]) continue;
      var val = z[j];
      var improves = type === 'max'
        ? (val.m.isNeg() || (val.m.isZero() && val.c.isNeg()))
        : (val.m.isPos() || (val.m.isZero() && val.c.isPos()));
      if (improves) return { col: j, val: val };
    }
    return null;
  }

  function runPhase(ctx) {
    // ctx: {rows, b, basis, costFull, type, varNames, enterMask, artificialSet, maxIter, rule}
    var rows = ctx.rows, b = ctx.b, basis = ctx.basis.slice(), costFull = ctx.costFull;
    var varNames = ctx.varNames, type = ctx.type, enterMask = ctx.enterMask;
    var m = rows.length, n = varNames.length;
    var rule = ctx.rule || 'auto';
    // 'auto' anti-cycling: start with Dantzig (matches the textbook/class
    // tableau sequence) and switch permanently to Bland the first time a
    // cycling risk is detected — a degenerate pivot (minimum ratio = 0) or
    // the objective failing to strictly improve versus the previous
    // iteration. We deliberately never switch back to Dantzig once Bland has
    // kicked in: staying in Bland is the simplest deterministic choice and
    // Bland's rule guarantees termination on its own from that point on.
    var autoState = 'dantzig';
    var prevZRHS = null;
    var iterations = [];
    var status = 'optimal';
    var flags = { degenerate: false, alternative: false };
    var maxIter = ctx.maxIter || 200;
    var z, zRHS;
    var reachedEnd = false;

    for (var iter = 0; iter < maxIter; iter++) {
      var zr = computeZRow(rows, b, basis, costFull);
      z = zr.z; zRHS = zr.zRHS;

      if (rule === 'auto') {
        if (prevZRHS !== null && autoState === 'dantzig') {
          var improvedNow = type === 'max' ? nCmp(zRHS, prevZRHS) > 0 : nCmp(zRHS, prevZRHS) < 0;
          if (!improvedNow) autoState = 'bland';
        }
        prevZRHS = zRHS;
      }
      var effectiveRule = rule === 'auto' ? autoState : rule;

      var picked = effectiveRule === 'bland'
        ? pickEnterBland(z, n, enterMask, type)
        : pickEnterDantzig(z, n, enterMask, type);
      var enterCol = picked ? picked.col : -1;
      var best = picked ? picked.val : null;

      if (enterCol === -1) {
        // optimal: check alternative optima (nonbasic decision var with reduced cost exactly 0)
        for (var j = 0; j < n; j++) {
          if (basis.indexOf(j) !== -1) continue;
          if (ctx.artificialSet && ctx.artificialSet[j]) continue;
          if (nIsZero(z[j])) { flags.alternative = true; break; }
        }
        var snap = snapshot(rows, b, basis, z, zRHS, varNames, null, null, null, 'Solución óptima alcanzada: ninguna variable no básica mejora ' + (type === 'max' ? 'el máximo' : 'el mínimo') + '.');
        iterations.push(snap);
        reachedEnd = true;
        break;
      }

      // ratio test
      var ratios = []; var leaveRow = -1; var minRatio = null;
      for (var i = 0; i < m; i++) {
        var a = rows[i][enterCol];
        if (a.isPos()) {
          var ratio = b[i].div(a);
          ratios.push({ row: i, value: ratio, isMin: false });
          if (minRatio === null || ratio.cmp(minRatio) < 0) { minRatio = ratio; leaveRow = i; }
        } else {
          ratios.push({ row: i, value: null, isMin: false });
        }
      }
      if (leaveRow === -1) {
        var snapU = snapshot(rows, b, basis, z, zRHS, varNames, enterCol, null, ratios,
          'La columna de ' + varNames[enterCol] + ' entra pero no tiene coeficientes positivos: el problema no está acotado.');
        iterations.push(snapU);
        status = 'unbounded';
        return { iterations: iterations, status: status, flags: flags, rows: rows, b: b, basis: basis, z: z, zRHS: zRHS };
      }
      // mark ties (degenerate)
      var tieCount = 0;
      ratios.forEach(function (rr) { if (rr.value !== null && rr.value.eq(minRatio)) { rr.isMin = true; tieCount++; } });
      if (tieCount > 1) flags.degenerate = true;
      // tie-break: smallest current basis variable index leaves first (Bland's rule, avoids cycling)
      if (tieCount > 1) {
        var candidates = ratios.filter(function (rr) { return rr.isMin; }).map(function (rr) { return rr.row; });
        candidates.sort(function (x, y) { return basis[x] - basis[y]; });
        leaveRow = candidates[0];
      }
      if (b[leaveRow].isZero()) {
        flags.degenerate = true;
        if (rule === 'auto') autoState = 'bland';
      }

      var ratioText = ratios.map(function (rr) {
        var name = varNames[basis[rr.row]];
        return name + ': ' + (rr.value === null ? '—' : ('(' + b[rr.row].toString() + ')/(' + rows[rr.row][enterCol].toString() + ') = ' + rr.value.toString()));
      }).join('; ');

      html += '<div><p class="muted">Función objetivo (' + (elType.value === 'max' ? 'maximizar' : 'minimizar') + ' z)</p><div class="input-grid sx-crow">';
      for (var j = 0; j < n; j++) html += '<input type="text" class="sx-c" data-j="' + j + '" value="1" aria-label="c' + (j + 1) + '" placeholder="c' + (j + 1) + '">';
      html += '</div></div></div>';
      html += '<table class="data sx-conrows"><thead><tr><th>Restricción</th>';
      for (j = 0; j < n; j++) html += '<th>x' + (j + 1) + '</th>';
      html += '<th>Operador</th><th>RHS</th></tr></thead><tbody>';
      for (var i = 0; i < m; i++) {
        html += '<tr><td>R' + (i + 1) + '</td>';
        for (j = 0; j < n; j++) html += '<td><input type="text" class="sx-a" data-i="' + i + '" data-j="' + j + '" value="1" style="width:64px"></td>';
        html += '<td><select class="sx-op" data-i="' + i + '"><option value="<=">≤</option><option value=">=">≥</option><option value="=">=</option></select></td>';
        html += '<td><input type="text" class="sx-b" data-i="' + i + '" value="1" style="width:70px"></td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
      elModel.innerHTML = html;
    }

    function loadExample(key) {
      var ex = EXAMPLES[key];
      elType.value = ex.spec.type;
      elMethod.value = ex.method;
      elN.value = ex.spec.c.length;
      elM.value = ex.spec.constraints.length;
      buildGrid();
      ex.spec.c.forEach(function (v, j) { elModel.querySelector('.sx-c[data-j="' + j + '"]').value = v; });
      ex.spec.constraints.forEach(function (con, i) {
        con.a.forEach(function (v, j) { elModel.querySelector('.sx-a[data-i="' + i + '"][data-j="' + j + '"]').value = v; });
        elModel.querySelector('.sx-op[data-i="' + i + '"]').value = con.op;
        elModel.querySelector('.sx-b[data-i="' + i + '"]').value = con.b;
      });
      run();
    }

    function readModel() {
      var n = parseInt(elN.value, 10), m = parseInt(elM.value, 10);
      var c = [];
      for (var j = 0; j < n; j++) c.push(elModel.querySelector('.sx-c[data-j="' + j + '"]').value || 0);
      var constraints = [];
      for (var i = 0; i < m; i++) {
        var a = [];
        for (j = 0; j < n; j++) a.push(elModel.querySelector('.sx-a[data-i="' + i + '"][data-j="' + j + '"]').value || 0);
        constraints.push({
          a: a,
          op: elModel.querySelector('.sx-op[data-i="' + i + '"]').value,
          b: elModel.querySelector('.sx-b[data-i="' + i + '"]').value || 0
        });
      }
      return { type: elType.value, c: c, constraints: constraints };
    }

    function run() {
      try {
        var spec = readModel();
        var model = S.parse(spec);
        var result = S.solve(model, { method: elMethod.value });
        state.model = model; state.result = result; state.idx = 0;
        render();
      } catch (e) {
        elTableauWrap.innerHTML = '<p class="callout callout-warn">No se pudo resolver el modelo: ' + esc(e.message) + '</p>';
        elStepText.textContent = '';
        elCase.innerHTML = '';
      }
    }

    function render() {
      var iters = state.result.iterations;
      var it = iters[state.idx];
      elTableauWrap.innerHTML = '<div class="tableau-wrap">' + S.toHTML(it, state.model.varNames) + '</div>';
      var phaseTxt = it.phase ? ('[Fase ' + it.phase + '] ') : '';
      // it.note puede incluir <span class="frac"> (viene del propio motor simplex, no de input de usuario).
      elStepText.innerHTML = phaseTxt + it.note;
      elCounter.textContent = 'Paso ' + (state.idx + 1) + ' / ' + iters.length;
      elPrev.disabled = state.idx === 0;
      elNext.disabled = state.idx === iters.length - 1;
      if (state.idx === iters.length - 1) {
        var badge = STATUS_BADGE[state.result.status] || 'badge';
        var html = '<span class="badge ' + badge + '">' + (STATUS_LABEL[state.result.status] || state.result.status) + '</span>';
        if (state.result.status === 'iteration_limit') {
          html += '<p class="callout callout-warn" style="margin-top:10px">Se alcanzó el límite de iteraciones; el resultado no es óptimo.</p>';
        } else if (state.result.optimal) {
          html += '<div class="kv" style="margin-top:10px">';
          html += '<div><span>z*</span><span>' + fracHTML(state.result.optimal.z) + ' (' + state.result.optimal.z.toFixed(4) + ')</span></div>';
          Object.keys(state.result.optimal.x).forEach(function (name) {
            var v = state.result.optimal.x[name];
            if (!v.isZero()) html += '<div><span>' + esc(name) + '</span><span>' + fracHTML(v) + '</span></div>';
          });
          html += '</div>';
        }
        elCase.innerHTML = html;
      } else {
        elCase.innerHTML = '';
      }
    }

    elExample.addEventListener('change', function () { loadExample(elExample.value); });
    elBuild.addEventListener('click', buildGrid);
    elModel.addEventListener('change', run);
    elMethod.addEventListener('change', run);
    elType.addEventListener('change', function () { buildGrid(); run(); });
    elPrev.addEventListener('click', function () { if (state.idx > 0) { state.idx--; render(); } });
    elNext.addEventListener('click', function () { if (state.result && state.idx < state.result.iterations.length - 1) { state.idx++; render(); } });
    elAll.addEventListener('click', function () { if (state.result) { state.idx = state.result.iterations.length - 1; render(); } });
    elReset.addEventListener('click', function () { if (state.result) { state.idx = 0; render(); } });

    Object.keys(EXAMPLES).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key; opt.textContent = EXAMPLES[key].label;
      elExample.appendChild(opt);
    });
    elExample.value = 'reddy';
    loadExample('reddy');
  }

  /* ================= Widget 2: Sensibilidad algebraica ================= */
  function mountSensitivity(root) {
    var elExample = root.querySelector('.sn-example');
    var elOut = root.querySelector('.sn-out');
    var elWhatB = root.querySelector('.sn-whatb-i');
    var elWhatBVal = root.querySelector('.sn-whatb-val');
    var elWhatBBtn = root.querySelector('.sn-whatb-btn');
    var elWhatBOut = root.querySelector('.sn-whatb-out');
    var elWhatC = root.querySelector('.sn-whatc-j');
    var elWhatCVal = root.querySelector('.sn-whatc-val');
    var elWhatCBtn = root.querySelector('.sn-whatc-btn');
    var elWhatCOut = root.querySelector('.sn-whatc-out');

    var state = { model: null, result: null };

    function load(key) {
      var ex = EXAMPLES[key];
      var model = S.parse(ex.spec);
      var result = S.solve(model, { method: ex.method });
      state.model = model; state.result = result;
      renderMain();
      fillSelectors();
    }

    function renderMain() {
      var res = state.result, model = state.model;
      if (res.status === 'iteration_limit') {
        elOut.innerHTML = '<p class="callout callout-warn">Se alcanzó el límite de iteraciones; el resultado no es óptimo. Elija TOYCO u otro ejemplo con óptimo para ver la sensibilidad.</p>';
        return;
      }
      if (!res.optimal) { elOut.innerHTML = '<p class="callout callout-warn">Este ejemplo no tiene un óptimo finito con solución única; elija TOYCO u otro ejemplo con óptimo para ver la sensibilidad.</p>'; return; }
      var sens = res.sensitivity;
      var html = '<div class="grid-2">';
      html += '<div><p class="panel-title" style="font-size:1rem">Solución óptima</p><div class="kv">';
      html += '<div><span>z*</span><span>' + fracHTML(res.optimal.z) + '</span></div>';
      Object.keys(res.optimal.x).forEach(function (name) {
        var v = res.optimal.x[name];
        if (!v.isZero()) html += '<div><span>' + esc(name) + '</span><span>' + fracHTML(v) + '</span></div>';
      });
      html += '</div></div>';
      html += '<div><p class="panel-title" style="font-size:1rem">Precios duales (y<sub>i</sub>)</p><div class="kv">';
      sens.duals.forEach(function (y, i) { html += '<div><span>Restricción ' + (i + 1) + '</span><span>' + fracHTML(y) + '</span></div>'; });
      html += '</div></div></div>';

      html += '<p class="panel-title" style="font-size:1rem;margin-top:14px">Rangos de factibilidad del lado derecho (b<sub>i</sub>)</p>';
      html += '<table class="data"><thead><tr><th>Restricción</th><th>b actual</th><th>Rango factible</th></tr></thead><tbody>';
      sens.rhsRanges.forEach(function (rr, i) {
        html += '<tr><td>R' + (i + 1) + '</td><td>' + fracHTML(model.b[i]) + '</td><td>' +
          fmtBound(rr.lower, true) + ' ≤ b' + (i + 1) + ' ≤ ' + fmtBound(rr.upper, false) + '</td></tr>';
      });
      html += '</tbody></table>';

      html += '<p class="panel-title" style="font-size:1rem;margin-top:14px">Rangos de optimalidad de c<sub>j</sub> y costos reducidos</p>';
      html += '<table class="data"><thead><tr><th>Variable</th><th>c actual</th><th>Rango de optimalidad</th><th>Costo reducido</th></tr></thead><tbody>';
      sens.cRanges.forEach(function (cr) {
        var name = model.varNames[cr.j];
        var rc = sens.reducedCosts[name];
        html += '<tr><td>' + esc(name) + '</td><td>' + fracHTML(model.cRow[cr.j]) + '</td><td>' +
          fmtBound(cr.lower, true) + ' ≤ c ≤ ' + fmtBound(cr.upper, false) + '</td><td>' +
          (rc !== undefined ? fracHTML(rc) : '0 (básica)') + '</td></tr>';
      });
      html += '</tbody></table>';
      elOut.innerHTML = html;
    }

    function fillSelectors() {
      var model = state.model;
      elWhatB.innerHTML = '';
      model.b.forEach(function (b, i) {
        var opt = document.createElement('option'); opt.value = i; opt.textContent = 'b' + (i + 1) + ' (actual ' + b.toString() + ')';
        elWhatB.appendChild(opt);
      });
      elWhatBVal.value = model.b[0] ? model.b[0].toNumber() : 0;
      elWhatC.innerHTML = '';
      for (var j = 0; j < model.nDecision; j++) {
        var opt2 = document.createElement('option'); opt2.value = j; opt2.textContent = model.varNames[j] + ' (actual ' + model.cRow[j].toString() + ')';
        elWhatC.appendChild(opt2);
      }
      elWhatCVal.value = model.cRow[0] ? model.cRow[0].toNumber() : 0;
      elWhatBOut.innerHTML = ''; elWhatCOut.innerHTML = '';
    }

    function whatIfB() {
      if (!state.result.sensitivity) {
        elWhatBOut.innerHTML = '<span class="badge badge-warn">Sin datos de sensibilidad</span> Este ejemplo no llegó a un óptimo (por ejemplo, se agotaron las iteraciones); elija otro ejemplo.';
        return;
      }
      var i = parseInt(elWhatB.value, 10);
      var newB = global.Frac.from(String(elWhatBVal.value).trim() === "" ? 0 : elWhatBVal.value);
      var rr = state.result.sensitivity.rhsRanges[i];
      var inRange = (isUnboundedLower(rr.lower) || newB.cmp(rr.lower) >= 0) && (isUnboundedUpper(rr.upper) || newB.cmp(rr.upper) <= 0);
      var html;
      if (inRange) {
        html = '<span class="badge badge-ok">Sigue óptima la misma base</span> La base actual sigue siendo factible y óptima; solo cambian los valores de las variables básicas (recalcule X<sub>B</sub> = B⁻¹b con el nuevo b).';
      } else {
        html = '<span class="badge badge-warn">La base actual deja de ser factible</span> b' + (i + 1) + ' = ' + newB.toString() +
          ' sale del rango [' + fmtBound(rr.lower, true) + ', ' + fmtBound(rr.upper, false) +
          ']. Hace falta resolver de nuevo (por ejemplo con simplex dual) porque alguna variable básica se volvería negativa.';
      }
      elWhatBOut.innerHTML = html;
    }

    function whatIfC() {
      if (!state.result.sensitivity) {
        elWhatCOut.innerHTML = '<span class="badge badge-warn">Sin datos de sensibilidad</span> Este ejemplo no llegó a un óptimo (por ejemplo, se agotaron las iteraciones); elija otro ejemplo.';
        return;
      }
      var j = parseInt(elWhatC.value, 10);
      var newC = global.Frac.from(String(elWhatCVal.value).trim() === "" ? 0 : elWhatCVal.value);
      var cr = state.result.sensitivity.cRanges[j];
      var inRange = (isUnboundedLower(cr.lower) || newC.cmp(cr.lower) >= 0) && (isUnboundedUpper(cr.upper) || newC.cmp(cr.upper) <= 0);
      var name = state.model.varNames[j];
      var html;
      if (inRange) {
        html = '<span class="badge badge-ok">Sigue óptima la misma base</span> c<sub>' + esc(name) + '</sub> = ' + newC.toString() +
          ' está dentro del rango de optimalidad; la solución óptima actual no cambia (z* sí cambia si la variable es básica).';
      } else {
        html = '<span class="badge badge-warn">Cambia la base óptima</span> c<sub>' + esc(name) + '</sub> = ' + newC.toString() +
          ' sale del rango [' + fmtBound(cr.lower, true) + ', ' + fmtBound(cr.upper, false) +
          ']. Hace falta recomputar la fila z y seguir iterando con simplex primal.';
      }
      elWhatCOut.innerHTML = html;
    }

    elExample.addEventListener('change', function () { load(elExample.value); });
    elWhatBBtn.addEventListener('click', whatIfB);
    elWhatCBtn.addEventListener('click', whatIfC);
    Object.keys(EXAMPLES).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key; opt.textContent = EXAMPLES[key].label;
      elExample.appendChild(opt);
    });
    elExample.value = 'toyco';
    load('toyco');
  }

  /* ================= Secciones (teoría, ejemplos, ejercicios) ================= */

  var s31 = '<p>Para aplicar el método simplex, todo modelo de PL se escribe primero en <strong>forma de ecuación</strong>: ' +
    'todas las restricciones se convierten en igualdades y todas las variables quedan restringidas a valores no negativos.</p>' +
    '<div class="callout callout-def"><strong>Definición.</strong> Forma de ecuación de un modelo de PL: ' +
    '(1) toda restricción ≤ recibe una <em>variable de holgura</em> s<sub>i</sub> ≥ 0 que se suma; ' +
    '(2) toda restricción ≥ recibe una <em>variable de excedente</em> e<sub>i</sub> ≥ 0 que se resta; ' +
    '(3) toda restricción = queda igual, pero en el método simplex necesita además una <em>variable artificial</em> R<sub>i</sub> ≥ 0 ' +
    '(y las ≥ también, sumada, para tener un punto de partida factible con solución básica identidad); ' +
    '(4) si el lado derecho b es negativo, se multiplica toda la restricción por −1 (lo que invierte el sentido de la desigualdad); ' +
    '(5) una variable libre (sin restricción de signo) x se reemplaza por x = x⁺ − x⁻, con x⁺, x⁻ ≥ 0.</p></div>' +
    '<p><strong>Ejemplo (Reddy Mikks).</strong> max z = 5x1 + 4x2 sujeto a:</p>' +
    '<div class="formula">6x1 + 4x2 ≤ 24<br>x1 + 2x2 ≤ 6<br>−x1 + x2 ≤ 1<br>x2 ≤ 2<br>x1, x2 ≥ 0</div>' +
    '<p>En forma de ecuación (con holguras s1..s4):</p>' +
    '<div class="formula">6x1 + 4x2 + s1 = 24<br>x1 + 2x2 + s2 = 6<br>−x1 + x2 + s3 = 1<br>x2 + s4 = 2</div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> Escriba en forma de ecuación: min z = 4x1 + x2; 3x1 + x2 = 3; 4x1 + 3x2 ≥ 6; x1 + 2x2 ≤ 4.</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>3x1 + x2 + R1 = 3; 4x1 + 3x2 − e2 + R2 = 6; x1 + 2x2 + s3 = 4. ' +
    'Se agregan artificiales R1 (por la igualdad) y R2 (por la ≥) porque no hay una variable "de holgura" natural que dé una base identidad inicial en esas dos filas.</p></details></div>';

  var s32 = '<div class="callout callout-def"><strong>Solución básica.</strong> Dado un sistema de m ecuaciones con n incógnitas (n ≥ m) en forma de ecuación, ' +
    'una solución básica se obtiene igualando a 0 exactamente n − m variables (las <em>no básicas</em>) y resolviendo el sistema cuadrado resultante para las m restantes ' +
    '(las <em>variables básicas</em>). Si además todas las variables básicas resultan ≥ 0, la solución se llama <strong>básica factible</strong>.</div>' +
    '<p>El número de soluciones básicas posibles (eligiendo qué n − m variables poner en 0) está acotado por la combinación</p>' +
    '<div class="formula eq">C(n, m) = n! / (m! (n − m)!)</div>' +
    '<p>Cada solución básica factible corresponde exactamente a un <strong>punto extremo (vértice)</strong> de la región factible, y viceversa: ' +
    'esta es la conexión clave entre la solución gráfica del cap. 2 y el álgebra del simplex — el simplex es, en el fondo, ' +
    'una forma inteligente de recorrer vértices sin enumerarlos todos.</p>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> Para Reddy Mikks en forma de ecuación (n = 6 variables: x1,x2,s1..s4; m = 4 ecuaciones), ' +
    '¿cuántas soluciones básicas como máximo pueden existir?</p><details class="solution"><summary>Ver solución</summary>' +
    '<p>C(6,4) = 15. No todas son factibles: el óptimo (3, 1.5) es una de las soluciones básicas factibles, con s3 = 5/2 y s4 = 1/2 básicas y x1, x2 también básicas (m = 4 básicas, n − m = 2 no básicas: s1 = s2 = 0).</p></details></div>';

  var s33 = '<p>El método simplex es <strong>iterativo</strong>: parte de una solución básica factible inicial (típicamente el origen, con las holguras como base) ' +
    'y en cada paso se mueve a un vértice adyacente que mejora (o al menos no empeora) el valor de z, hasta que ninguna mejora es posible.</p>' +
    '<div class="callout callout-def"><strong>Condición de optimalidad.</strong> En un problema de <em>maximización</em>, entra a la base la variable no básica ' +
    'con el coeficiente <strong>más negativo</strong> en la fila z (así aumenta z lo más rápido posible por unidad). En <em>minimización</em>, entra la de coeficiente ' +
    '<strong>más positivo</strong>. Si ningún candidato cumple la condición, la solución actual ya es óptima.</div>' +
    '<div class="callout callout-def"><strong>Condición de factibilidad (regla del cociente mínimo).</strong> Entre las filas con coeficiente positivo en la columna entrante, ' +
    'sale de la base la variable de la fila con el <strong>cociente mínimo</strong> RHS / coeficiente. Esto garantiza que ninguna variable básica se vuelva negativa.</div>' +
    '<p>El pivoteo se hace con <strong>operaciones de Gauss-Jordan</strong>: la fila pivote se divide entera por el elemento pivote (para dejar un 1 en esa posición), ' +
    'y a cada una de las demás filas (incluida la fila z) se le resta un múltiplo adecuado de la fila pivote para dejar ceros en el resto de la columna pivote.</p>' +
    '<div class="callout callout-tip"><strong>Resumen del algoritmo.</strong>' +
    '<ol><li>Forma de ecuación y tabla inicial (base = holguras/artificiales).</li>' +
    '<li>¿Óptima? (condición de optimalidad). Si sí, parar.</li>' +
    '<li>Elegir variable entrante.</li><li>Cociente mínimo → variable saliente. Si no hay cocientes, el problema no está acotado.</li>' +
    '<li>Pivotear (Gauss-Jordan) y volver al paso 2.</li></ol></div>' +
    '<p>Use el widget «Simplex paso a paso» de la sección 3.7 para seguir Reddy Mikks tabla por tabla (3 tablas hasta el óptimo (3, 1.5), z = 21).</p>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> En la tabla inicial de Reddy Mikks (base = s1..s4), la fila z es (−5, −4, 0, 0, 0, 0 | 0). ¿Qué variable entra primero y por qué?</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>Entra x1: es una maximización, y −5 es el coeficiente más negativo de la fila z (más negativo que el −4 de x2).</p></details></div>';

  var s34 = '<p>Cuando una restricción es <strong>=</strong> o <strong>≥</strong>, no hay una variable natural con coeficiente +1 aislado en esa fila para arrancar la base; ' +
    'se agrega una <strong>variable artificial</strong> R<sub>i</sub> ≥ 0 solo para tener una base identidad inicial. Como R<sub>i</sub> no tiene significado físico, ' +
    'el método debe forzarla a valer 0 en la solución final. Hay dos formas de lograrlo:</p>' +
    '<div class="callout callout-def"><strong>Método M (Big-M).</strong> Se penaliza cada artificial en la función objetivo con un costo enorme M ' +
    '(−M en max, +M en min), de modo que el simplex la expulsa de la base en cuanto puede. Los coeficientes de la fila z quedan de la forma a + bM ' +
    '(por ejemplo "−4 − 3M"), y para comparar dos coeficientes primero se compara el término en M y, si empatan, el término constante.</div>' +
    '<div class="callout callout-def"><strong>Método de dos fases.</strong> Fase I: se resuelve un problema auxiliar que minimiza r = Σ R<sub>i</sub> ' +
    '(ignorando la función objetivo original). Si el óptimo de la fase I da r = 0, hay una solución factible para el problema original y se eliminan ' +
    'las columnas artificiales; si r > 0, el problema original es no factible. Fase II: se restaura la función objetivo real (recalculando la fila z sobre ' +
    'la base con la que terminó la fase I) y se sigue iterando con simplex normal.</div>' +
    '<p><strong>Ejemplo.</strong> min z = 4x1 + x2 sujeto a 3x1 + x2 = 3; 4x1 + 3x2 ≥ 6; x1 + 2x2 ≤ 4; x ≥ 0. ' +
    'Óptimo: x1 = 2/5, x2 = 9/5, z = 17/5 — verificado con ambos métodos (M y dos fases) en el widget, dan la misma solución.</p>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> ¿Por qué la restricción x1 + 2x2 ≤ 4 no necesita variable artificial?</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>Porque al ser ≤ con b ≥ 0, su holgura s3 ya aporta un coeficiente +1 aislado, ' +
    'suficiente para formar la base identidad inicial en esa fila sin necesidad de una artificial.</p></details></div>';

  var s35 = '<p>El tableau simplex puede mostrar cuatro situaciones especiales, todas detectables mirando la tabla:</p>' +
    '<div class="grid-2">' +
    '<div class="callout callout-warn"><strong>Degeneración.</strong> Una variable básica vale 0 (empate en la regla del cociente mínimo). ' +
    'Ejemplo: max 3x1 + 9x2; x1 + 4x2 ≤ 8; x1 + 2x2 ≤ 4. El óptimo (0, 2), z = 18 se alcanza pasando por una tabla con una variable básica en 0. ' +
    'No cambia el resultado final, pero en teoría puede (rara vez) causar ciclos.</div>' +
    '<div class="callout callout-warn"><strong>Óptimos alternativos.</strong> En la tabla óptima, una variable no básica tiene coeficiente 0 en la fila z: ' +
    'se puede meter a la base sin cambiar z, y existe todo un segmento de soluciones óptimas. Ejemplo: max 2x1 + 4x2; x1 + 2x2 ≤ 5; x1 + x2 ≤ 4; z* = 10 ' +
    'se alcanza tanto en (0, 2.5) como en (3, 1).</div>' +
    '<div class="callout callout-warn"><strong>No acotado.</strong> La columna de la variable entrante no tiene ningún coeficiente positivo: se puede aumentar ' +
    'esa variable indefinidamente sin violar ninguna restricción, y z crece (o decrece) sin límite. Ejemplo: max 2x1 + x2; x1 − x2 ≤ 10; 2x1 ≤ 40.</div>' +

</script>
  <script>
/* Cap 4 — Dualidad y análisis postóptimo. Owner: D.
 * Implementa su propio pivoteo con Frac (NO depende de IO.Simplex).
 */
window.IO = window.IO || { chapters: [] };
IO.registerChapter = IO.registerChapter || function (ch) { IO.chapters.push(ch); };

(function () {
  'use strict';

  /* ---------------------------------------------------------------------
   * 0. Helpers
   * ------------------------------------------------------------------- */
  var F = Frac;
  function fz() { return F.ZERO; }
  function fnum(v) { return F.from(v); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* ---------------------------------------------------------------------
   * 1. Tableau engine (Gauss-Jordan con Frac). Formato Taha: fila z arriba,
   *    z.vals[j] = z_j - c_j (óptimo en max cuando todos >= 0).
   * ------------------------------------------------------------------- */
  function cloneTab(tab) {
    return {
      names: tab.names.slice(),
      rows: tab.rows.map(function (r) { return { basis: r.basis, vals: r.vals.map(function (v) { return v; }), rhs: r.rhs }; }),
      z: { vals: tab.z.vals.map(function (v) { return v; }), rhs: tab.z.rhs },
      maximize: tab.maximize,
      objSign: tab.objSign
    };
  }

  function pivot(tab, rowIdx, colIdx) {
    var t = cloneTab(tab);
    var row = t.rows[rowIdx];
    var piv = row.vals[colIdx];
    var n = t.names.length;
    var newVals = new Array(n);
    for (var j = 0; j < n; j++) newVals[j] = row.vals[j].div(piv);
    var newRhs = row.rhs.div(piv);
    row.vals = newVals;
    row.rhs = newRhs;
    row.basis = colIdx;
    function eliminate(target) {
      var factor = target.vals[colIdx];
      if (factor.isZero()) return;
      var vv = new Array(n);
      for (var j = 0; j < n; j++) vv[j] = target.vals[j].sub(factor.mul(newVals[j]));
      target.vals = vv;
      target.rhs = target.rhs.sub(factor.mul(newRhs));
    }
    for (var r = 0; r < t.rows.length; r++) if (r !== rowIdx) eliminate(t.rows[r]);
    eliminate(t.z);
    return t;
  }

  /* Primal step: entra la col con z_j-c_j mas negativo; sale por razon minima. */
  function primalStep(tab) {
    var enter = -1, best = null;
    for (var j = 0; j < tab.names.length; j++) {
      var v = tab.z.vals[j];
      if (v.isNeg() && (best === null || v.cmp(best) < 0)) { best = v; enter = j; }
    }
    if (enter === -1) return { optimal: true };
    var leave = -1, bestRatio = null, ratios = [];
    for (var r = 0; r < tab.rows.length; r++) {
      var a = tab.rows[r].vals[enter];
      if (a.isPos()) {
        var ratio = tab.rows[r].rhs.div(a);
        ratios[r] = ratio;
        if (bestRatio === null || ratio.cmp(bestRatio) < 0) { bestRatio = ratio; leave = r; }
      } else { ratios[r] = null; }
    }
    if (leave === -1) return { unbounded: true, entering: enter };
    return { entering: enter, leaving: leave, ratios: ratios, pivotVal: tab.rows[leave].vals[enter] };
  }

  /* Dual step: sale la fila con RHS mas negativo; entra por cociente minimo
   * |z_j - c_j| / |a_rj| entre columnas con a_rj < 0 de esa fila. */
  function dualStep(tab) {
    var leave = -1, worst = null;
    for (var r = 0; r < tab.rows.length; r++) {
      var rhs = tab.rows[r].rhs;
      if (rhs.isNeg() && (worst === null || rhs.cmp(worst) < 0)) { worst = rhs; leave = r; }
    }
    if (leave === -1) return { optimal: true, feasible: true };
    var enter = -1, bestRatio = null, ratios = [];
    for (var j = 0; j < tab.names.length; j++) {
      var a = tab.rows[leave].vals[j];
      if (a.isNeg()) {
        var ratio = tab.z.vals[j].abs().div(a.abs());
        ratios[j] = ratio;
        if (bestRatio === null || ratio.cmp(bestRatio) < 0) { bestRatio = ratio; enter = j; }
      } else { ratios[j] = null; }
    }
    if (enter === -1) return { infeasible: true, leaving: leave };
    return { entering: enter, leaving: leave, ratios: ratios, pivotVal: tab.rows[leave].vals[enter] };
  }

  function tabToHTML(tab, opts) {
    opts = opts || {};
    var pr = opts.pivotRow, pc = opts.pivotCol;
    var out = '<div class="canvas-wrap" style="overflow-x:auto"><table class="tableau"><thead><tr><th>Base</th>';
    for (var j = 0; j < tab.names.length; j++) out += '<th' + (j === pc ? ' class="pivot-col"' : '') + '>' + esc(tab.names[j]) + '</th>';
    out += '<th>LD</th></tr></thead><tbody>';
    out += '<tr class="z-row"><td><em>z</em></td>';
    for (var j2 = 0; j2 < tab.names.length; j2++) out += '<td' + (j2 === pc ? ' class="pivot-col"' : '') + '>' + tab.z.vals[j2].toHTML() + '</td>';
    out += '<td>' + tab.z.rhs.toHTML() + '</td></tr>';
    for (var r = 0; r < tab.rows.length; r++) {
      var row = tab.rows[r];
      var rowCls = (r === pr) ? ' class="pivot-row"' : '';
      out += '<tr' + rowCls + '><td class="basic">' + esc(tab.names[row.basis]) + '</td>';
      for (var j3 = 0; j3 < tab.names.length; j3++) {
        var isPivotCell = (r === pr && j3 === pc);
        var cls = [];
        if (j3 === pc) cls.push('pivot-col');
        if (r === pr) cls.push('pivot-row');
        if (isPivotCell) cls.push('pivot-cell');
        out += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + row.vals[j3].toHTML() + '</td>';
      }
      out += '<td>' + row.rhs.toHTML() + '</td></tr>';
    }
    out += '</tbody></table></div>';
    return out;
  }

  /* ---------------------------------------------------------------------
   * 2. Constructor del dual (reglas de Taha, tabla §4.1)
   * ------------------------------------------------------------------- */
  /* primal = { type:'max'|'min', c:[Frac], names:[x1..], varSign:['>=0'|'<=0'|'free'],
   *            constraints:[{a:[Frac], op:'<='|'>='|'=', b:Frac, name:'R1'}] } */
  function buildDual(primal) {
    var m = primal.constraints.length;
    var n = primal.c.length;
    var dualType = primal.type === 'max' ? 'min' : 'max';
    var explain = [];
    // dual variable sign per primal constraint
    var ySign = [];
    for (var i = 0; i < m; i++) {
      var op = primal.constraints[i].op;
      var s;
      if (primal.type === 'max') {
        s = op === '<=' ? '>=0' : (op === '>=' ? '<=0' : 'free');
      } else {
        s = op === '>=' ? '>=0' : (op === '<=' ? '<=0' : 'free');
      }
      ySign.push(s);
      explain.push('Restricción primal ' + (primal.constraints[i].name || ('R' + (i + 1))) + ' es "' + op + '" → y' + (i + 1) + ' ' + (s === 'free' ? 'irrestricta' : s));
    }
    // dual constraint op per primal variable sign
    var dualOps = [];
    for (var j = 0; j < n; j++) {
      var vs = primal.varSign[j];
      var dop;
      if (primal.type === 'max') {
        dop = vs === '>=0' ? '>=' : (vs === '<=0' ? '<=' : '=');
      } else {
        dop = vs === '>=0' ? '<=' : (vs === '<=0' ? '>=' : '=');
      }
      dualOps.push(dop);
      explain.push('Variable primal ' + (primal.names ? primal.names[j] : ('x' + (j + 1))) + ' es "' + (vs === 'free' ? 'irrestricta' : vs) + '" → restricción dual ' + (j + 1) + ' es "' + dop + '"');
    }
    // dual objective coefficients = b_i ; dual constraint matrix = A^T ; dual RHS = c_j
    var dualC = primal.constraints.map(function (ct) { return ct.b; });
    var dualConstraints = [];
    for (var jj = 0; jj < n; jj++) {
      var row = [];
      for (var ii = 0; ii < m; ii++) row.push(primal.constraints[ii].a[jj]);
      dualConstraints.push({ a: row, op: dualOps[jj], b: primal.c[jj], name: 'D' + (jj + 1) });
    }
    var dualNames = [];
    for (var k = 0; k < m; k++) dualNames.push('y' + (k + 1));
    return { type: dualType, c: dualC, names: dualNames, varSign: ySign, constraints: dualConstraints, explain: explain };
  }

  function modelToHTML(model, isDual) {
    var s = '<div class="formula">' + (isDual ? 'w' : 'z') + ' ' + (model.type === 'max' ? '(max)' : '(min)') + ' = ';
    var terms = [];
    for (var j = 0; j < model.c.length; j++) terms.push(model.c[j].toHTML() + (model.c[j].isNeg() ? '' : '') + model.names[j]);
    s += terms.join(' + ').replace(/\+ -/g, '- ') + '</div><div class="formula">sujeto a:</div><ul class="formula" style="list-style:none;padding:0">';
    for (var i = 0; i < model.constraints.length; i++) {
      var ct = model.constraints[i];
      var t2 = [];
      for (var jj = 0; jj < ct.a.length; jj++) if (!ct.a[jj].isZero()) t2.push(ct.a[jj].toHTML() + model.names[jj]);
      s += '<li>' + t2.join(' + ').replace(/\+ -/g, '- ') + ' ' + ct.op + ' ' + ct.b.toHTML() + '</li>';
    }
    s += '</ul><div class="eq">';
    var signParts = [];
    for (var k = 0; k < model.varSign.length; k++) signParts.push(model.names[k] + ' ' + (model.varSign[k] === 'free' ? 'irrestricta' : model.varSign[k]));
    s += signParts.join(', ') + '</div>';
    return s;
  }

  /* Construye tableau inicial dual-factible a partir de un modelo min/max con
   * restricciones <=, >= (y = tratado como <= y >= combinadas). */
  function buildDualSimplexInitial(model) {
    var objSign = model.type === 'min' ? -1 : 1;
    var rows = [];
    model.constraints.forEach(function (ct) {
      if (ct.op === '=') {
        rows.push({ a: ct.a.slice(), b: ct.b, op: '<=' });
        rows.push({ a: ct.a.map(function (v) { return v.neg(); }), b: ct.b.neg(), op: '<=' });
      } else if (ct.op === '>=') {
        rows.push({ a: ct.a.map(function (v) { return v.neg(); }), b: ct.b.neg(), op: '<=' });
      } else {
        rows.push({ a: ct.a.slice(), b: ct.b, op: '<=' });
      }
    });
    var n = model.c.length;
    var m = rows.length;
    var names = model.names.slice();
    for (var i = 0; i < m; i++) names.push('s' + (i + 1));
    var internalC = model.c.map(function (cj) { return objSign === -1 ? cj.neg() : cj; });
    var zVals = new Array(names.length);
    for (var j = 0; j < n; j++) zVals[j] = internalC[j].neg();
    for (var j2 = n; j2 < names.length; j2++) zVals[j2] = fz();
    var tabRows = [];
    for (var r = 0; r < m; r++) {
      var vals = new Array(names.length);
      for (var c = 0; c < n; c++) vals[c] = rows[r].a[c];
      for (var s = 0; s < m; s++) vals[n + s] = (s === r) ? F.ONE : fz();
      tabRows.push({ basis: n + r, vals: vals, rhs: rows[r].b });
    }
    return { names: names, rows: tabRows, z: { vals: zVals, rhs: fz() }, maximize: true, objSign: objSign, nDecision: n };
  }

  function trueObjective(tab) { return tab.z.rhs.mul(fnum(tab.objSign)); }
  function varValue(tab, idx) {
    for (var r = 0; r < tab.rows.length; r++) if (tab.rows[r].basis === idx) return tab.rows[r].rhs;
    return fz();
  }

      } else if (state.finished === 'infeasible') {
        msg = '<span class="badge badge-err">Primal no factible</span>: la fila que debía salir no tiene coeficientes negativos para elegir variable entrante.';
      } else if (stepInfo && stepInfo.leaving !== undefined) {

          'Entra <strong>' + esc(state.tab.names[stepInfo.entering]) + '</strong> (cociente mínimo). Pivote = ' + stepInfo.pivotVal.toHTML() + '.';
      } else {

    function stepOnce() {
      if (state.finished) return false;

      state.tab = pivot(state.tab, info.leaving, info.entering);
      state.history.push(cloneTab(state.tab));
      render(info);
      return true;
    }

    root.querySelector('.btn-next').addEventListener('click', stepOnce);
    root.querySelector('.btn-all').addEventListener('click', function () {
      var guard = 0;
      while (stepOnce() && guard < 50) guard++;
    });
    root.querySelector('.btn-prev').addEventListener('click', function () {
      if (state.history.length > 1) {
        state.history.pop();

    });
    root.querySelector('.btn-reset').addEventListener('click', function () { reset(state.exIdx); });
    exPick.addEventListener('change', function () { reset(+exPick.value); });

    reset(0);
  }

  /* ---------------------------------------------------------------------
   * 6. Widget 3 — Postóptimo TOYCO
   * ------------------------------------------------------------------- */
  var TOYCO = {
    names: ['x1', 'x2', 'x3', 's1', 's2', 's3'],
    A: [P([1, 2, 1, 1, 0, 0]), P([3, 0, 2, 0, 1, 0]), P([1, 4, 0, 0, 0, 1])],
    c: P([3, 2, 5, 0, 0, 0]),
    b: P([430, 460, 420]),
    basis: [1, 2, 5], // x2, x3, s3
    Binv: [
      [F.of(1, 2), F.of(-1, 4), fz()],
      [fz(), F.of(1, 2), fz()],
      [F.of(-2, 1), F.of(1, 1), F.of(1, 1)]
    ]
  };

  function matVec(M, v) {
    return M.map(function (row) {
      var s = fz();
      for (var i = 0; i < row.length; i++) s = s.add(row[i].mul(v[i]));
      return s;
    });
  }
  function vecMat(v, M) {
    var n = M[0].length;
    var out = [];
    for (var j = 0; j < n; j++) {
      var s = fz();
      for (var i = 0; i < M.length; i++) s = s.add(v[i].mul(M[i][j]));
      out.push(s);
    }
    return out;
  }
  function dot(a, b) { var s = fz(); for (var i = 0; i < a.length; i++) s = s.add(a[i].mul(b[i])); return s; }

  function buildToycoTableau(b, c) {
    var Binv = TOYCO.Binv;
    var basis = TOYCO.basis;
    var cB = basis.map(function (idx) { return c[idx]; });
    var y = vecMat(cB, Binv); // y = cB * Binv
    var XB = matVec(Binv, b); // XB = Binv * b
    var names = TOYCO.names;
    var n = names.length;
    var m = 3;
    var zVals = [];
    for (var j = 0; j < n; j++) zVals.push(dot(y, TOYCO.A.map(function (row) { return row[j]; })).sub(c[j]));
    var zRhs = dot(cB, XB);
    // build each column j as Binv * A_j, then assemble rows
    var cols = [];
    for (var jj = 0; jj < n; jj++) {
      var Aj = TOYCO.A.map(function (row) { return row[jj]; });
      cols.push(matVec(Binv, Aj));
    }
    var tabRows = [];
    for (var r = 0; r < m; r++) {
      var vals = [];
      for (var j2 = 0; j2 < n; j2++) vals.push(cols[j2][r]);
      tabRows.push({ basis: basis[r], vals: vals, rhs: XB[r] });
    }
    return { names: names, rows: tabRows, z: { vals: zVals, rhs: zRhs }, maximize: true, objSign: 1, Binv: Binv, y: y, cB: cB };
  }

    function renderBaseInfo() {

      var y = vecMat(cB, Binv);
      var s = '<div class="kv"><div>B⁻¹</div><div>' +
        Binv.map(function (row) { return '[' + row.map(function (v) { return v.toHTML(); }).join(', ') + ']'; }).join('<br>') +
        '</div><div>c<sub>B</sub></div><div>[' + cB.map(function (v) { return v.toHTML(); }).join(', ') + ']</div>' +
        '<div>y = c<sub>B</sub>B⁻¹</div><div>(' + y.map(function (v) { return v.toHTML(); }).join(', ') + ')</div></div>';
      baseInfo.innerHTML = s;
    }
    renderBaseInfo();

    function renderStepper(finalMsgIfNone) {
      if (!stepper.tab) { tabHolder.innerHTML = ''; stepText.innerHTML = finalMsgIfNone || ''; return; }
      tabHolder.innerHTML = tabToHTML(stepper.tab, stepper.lastInfo || {});
      stepText.innerHTML = stepper.msg || '';
    }

    function stepOnce() {
      if (!stepper.tab || stepper.finished) return false;
      var info = stepper.mode === 'dual' ? dualStep(stepper.tab) : primalStep(stepper.tab);
      if (info.optimal) {
        stepper.finished = 'optimal';
        stepper.msg = '<span class="badge badge-ok">Óptimo' + (stepper.mode === 'dual' ? ' y factible' : '') + '.</span> z = ' + trueObjective(stepper.tab).toHTML() + '.';
        stepper.lastInfo = {};
        renderStepper();
        return false;
      }
      if (info.infeasible) { stepper.finished = 'infeasible'; stepper.msg = '<span class="badge badge-err">No factible.</span>'; stepper.lastInfo = {}; renderStepper(); return false; }
      if (info.unbounded) { stepper.finished = 'unbounded'; stepper.msg = '<span class="badge badge-warn">No acotado.</span>'; stepper.lastInfo = {}; renderStepper(); return false; }
      var pr = info.leaving, pc = info.entering;
      stepper.msg = 'Sale <strong>' + esc(stepper.tab.names[stepper.tab.rows[pr].basis]) + '</strong>, entra <strong>' + esc(stepper.tab.names[pc]) + '</strong>. Pivote = ' + info.pivotVal.toHTML() + '.';
      stepper.tab = pivot(stepper.tab, pr, pc);
      stepper.history.push(cloneTab(stepper.tab));
      stepper.lastInfo = { pivotRow: pr, pivotCol: pc };
      renderStepper();
      return true;
    }
    root.querySelector('.btn-next').addEventListener('click', stepOnce);
    root.querySelector('.btn-all').addEventListener('click', function () { var g = 0; while (stepOnce() && g < 50) g++; });
    root.querySelector('.btn-prev').addEventListener('click', function () {
      if (stepper.history.length > 1) { stepper.history.pop(); stepper.tab = cloneTab(stepper.history[stepper.history.length - 1]); stepper.finished = null; stepper.lastInfo = {}; renderStepper(); }
    });
    root.querySelector('.btn-reset').addEventListener('click', function () { stepper.tab = null; stepper.history = []; stepper.finished = null; renderStepper('Use "Cambiar b", "Cambiar c" o "Agregar variable" para iniciar un recálculo.'); });

    root.querySelector('.btn-b').addEventListener('click', function () {
      var b = [F.from(root.querySelector('.b1').value), F.from(root.querySelector('.b2').value), F.from(root.querySelector('.b3').value)];
      var tab = buildToycoTableau(b, TOYCO.c);
      var neg = tab.rows.some(function (r) { return r.rhs.isNeg(); });
      var resDiv = root.querySelector('.b-result');
      if (!neg) {
        resDiv.innerHTML = '<span class="badge badge-ok">Sigue factible.</span> X<sub>B</sub> = B⁻¹b = (' +
          tab.rows.map(function (r) { return r.rhs.toHTML(); }).join(', ') + '), z = ' + tab.z.rhs.toHTML() + '.';
        stepper.tab = null; renderStepper('');
      } else {
        resDiv.innerHTML = '<span class="badge badge-warn">Deja de ser factible</span> (algún X<sub>B</sub> negativo). Se ejecuta simplex dual:';
        stepper.tab = tab; stepper.history = [cloneTab(tab)]; stepper.mode = 'dual'; stepper.finished = null; stepper.lastInfo = {};
        stepper.msg = 'Tabla con nuevo b, aún óptima (misma fila z) pero no factible. Pulse «Siguiente ▶».';
        renderStepper();
      }
    });

    root.querySelector('.btn-c').addEventListener('click', function () {
      var c = TOYCO.c.slice();
      c[0] = F.from(root.querySelector('.c1').value);
      c[1] = F.from(root.querySelector('.c2').value);
      c[2] = F.from(root.querySelector('.c3').value);
      var tab = buildToycoTableau(TOYCO.b, c);
      var neg = tab.z.vals.some(function (v) { return v.isNeg(); });
      var resDiv = root.querySelector('.c-result');
      if (!neg) {
        resDiv.innerHTML = '<span class="badge badge-ok">Sigue óptima.</span> z = ' + tab.z.rhs.toHTML() + '.';
        stepper.tab = null; renderStepper('');
      } else {
        resDiv.innerHTML = '<span class="badge badge-warn">Deja de ser óptima</span> (algún z<sub>j</sub>−c<sub>j</sub> negativo). Se ejecuta simplex primal:';
        stepper.tab = tab; stepper.history = [cloneTab(tab)]; stepper.mode = 'primal'; stepper.finished = null; stepper.lastInfo = {};
        stepper.msg = 'Tabla con nuevo c, aún factible (mismo X<sub>B</sub>) pero no óptima. Pulse «Siguiente ▶».';
        renderStepper();
      }
    });

    root.querySelector('.btn-nv').addEventListener('click', function () {
      var a = [F.from(root.querySelector('.na1').value), F.from(root.querySelector('.na2').value), F.from(root.querySelector('.na3').value)];
      var cNew = F.from(root.querySelector('.nc').value);
      var Binv = TOYCO.Binv;
      var cB = TOYCO.basis.map(function (idx) { return TOYCO.c[idx]; });
      var y = vecMat(cB, Binv);
      var col = matVec(Binv, a);
      var reduced = dot(y, a).sub(cNew);
      var resDiv = root.querySelector('.nv-result');
      if (reduced.cmp(fz()) >= 0) {
        resDiv.innerHTML = 'Costo reducido y·a − c = ' + reduced.toHTML() + ' ≥ 0. <span class="badge badge-warn">No conviene incorporarla.</span>';
        stepper.tab = null; renderStepper('');
      } else {
        resDiv.innerHTML = 'Costo reducido y·a − c = ' + reduced.toHTML() + ' &lt; 0. <span class="badge badge-ok">Conviene incorporarla.</span> Columna en la tabla: (' + col.map(function (v) { return v.toHTML(); }).join(', ') + '). Se agrega y se corre simplex primal:';
        var tab = buildToycoTableau(TOYCO.b, TOYCO.c);
        tab.names = tab.names.slice(); tab.names.splice(3, 0, 'xN');
        tab.rows = tab.rows.map(function (r, i) { var vv = r.vals.slice(); vv.splice(3, 0, col[i]); return { basis: r.basis >= 3 ? r.basis + 1 : r.basis, vals: vv, rhs: r.rhs }; });
        var zv = tab.z.vals.slice(); zv.splice(3, 0, reduced); // z_j - c_j for new var = y·a - c
        tab.z = { vals: zv, rhs: tab.z.rhs };
        stepper.tab = tab; stepper.history = [cloneTab(tab)]; stepper.mode = 'primal'; stepper.finished = null; stepper.lastInfo = {};
        stepper.msg = 'Nueva variable xN agregada con costo reducido negativo. Pulse «Siguiente ▶».';
        renderStepper();
      }
    });

    renderStepper('Use "Cambiar b", "Cambiar c" o "Agregar variable" para iniciar un recálculo.');
  }

  /* ---------------------------------------------------------------------
   * 7. Contenido teórico
   * ------------------------------------------------------------------- */
  var S1 = '<p>Todo problema de programación lineal (el <strong>primal</strong>) tiene asociado otro problema lineal, el ' +
    '<strong>dual</strong>, construido a partir de los mismos datos (coeficientes, restricciones, lado derecho) pero ' +
    'con los papeles invertidos: los coeficientes del lado derecho del primal pasan a ser los coeficientes objetivo del dual, ' +
    'y viceversa.</p>' +
    '<div class="callout callout-def"><strong>Definición.</strong> Si el primal es max z = Σ c<sub>j</sub>x<sub>j</sub> sujeto a ' +
    'Σ a<sub>ij</sub>x<sub>j</sub> {≤,≥,=} b<sub>i</sub>, el dual es min w = Σ b<sub>i</sub>y<sub>i</sub> con una variable y<sub>i</sub> ' +
    'por cada restricción primal y una restricción dual por cada variable primal.</div>' +
    '<p>La correspondencia exacta entre signos se resume en la tabla de reglas (Taha, tabla 4.1):</p>' +
    '<div class="canvas-wrap" style="overflow-x:auto"><table class="data"><thead><tr><th>Primal (max)</th><th>Dual (min)</th></tr>' +
    '<tr><th>Primal (min)</th><th>Dual (max)</th></tr></thead><tbody>' +
    '<tr><td>Restricción ≤</td><td>y<sub>i</sub> ≥ 0</td></tr>' +
    '<tr><td>Restricción ≥</td><td>y<sub>i</sub> ≤ 0</td></tr>' +
    '<tr><td>Restricción =</td><td>y<sub>i</sub> irrestricta</td></tr>' +
    '<tr><td>x<sub>j</sub> ≥ 0</td><td>restricción dual ≥ (si primal max) / ≤ (si primal min)</td></tr>' +
    '<tr><td>x<sub>j</sub> ≤ 0</td><td>restricción dual ≤ (si primal max) / ≥ (si primal min)</td></tr>' +
    '<tr><td>x<sub>j</sub> irrestricta</td><td>restricción dual =</td></tr>' +
    '</tbody></table></div>' +
    '<div class="callout callout-tip">Regla mnemónica: si el primal es <em>max</em>, las restricciones ≤ dan variables duales ≥0 ' +
    '(el "sentido natural"); si el primal es <em>min</em>, se invierte todo.</div>' +
    '<p><strong>Ejemplo resuelto (Reddy Mikks).</strong> Primal: max z = 5x1 + 4x2; 6x1+4x2≤24; x1+2x2≤6; −x1+x2≤1; x2≤2; x≥0. ' +
    'Como las cuatro restricciones son ≤ y las variables son ≥0, el dual es: min w = 24y1+6y2+y3+2y4; ' +
    '6y1+y2−y3≥5; 4y1+2y2+y3+y4≥4; y≥0. La solución óptima del dual es y = (3/4, 1/2, 0, 0), con w* = 21 — el mismo valor ' +
    'que z* = 21 del primal (dualidad fuerte).</p>' +
    '<div class="widget wide" data-widget="dual-builder"></div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> Escriba el dual de: min z = 4x1 + x2; 3x1 + x2 = 3; 4x1 + 3x2 ≥ 6; x1 + 2x2 ≤ 4; x ≥ 0.</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>max w = 3y1 + 6y2 + 4y3; 3y1+4y2+y3 ≤ 4; y1+3y2+2y3 ≤ 1; ' +
    'y1 irrestricta (por la igualdad), y2 ≥ 0, y3 ≤ 0 (restricción ≤ en un primal de min).</p></details></div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> Escriba el dual de Reddy Mikks y verifique que w* coincide con z* = 21.</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>Ver el ejemplo resuelto arriba: y=(3/4,1/2,0,0), w*=21=z*.</p></details></div>';

  var S2 = '<p>Toda la información del dual está escondida dentro de la tabla óptima del primal, sin necesidad de resolver el ' +
    'dual por separado. Esto se explica con álgebra de matrices: si B es la matriz de columnas de las variables básicas óptimas, ' +
    'B⁻¹ aparece bajo las columnas donde originalmente estaban las variables de holgura (la base inicial).</p>' +
    '<div class="callout callout-def"><strong>Tres métodos para obtener y* desde la tabla óptima:</strong>' +
    '<ol><li><strong>Matricial:</strong> y = c<sub>B</sub>B⁻¹ (vector fila de costos básicos por la inversa de B).</li>' +
    '<li><strong>Por las holguras:</strong> el coeficiente z<sub>j</sub>−c<sub>j</sub> que queda bajo la variable de holgura ' +
    'de la restricción i, sumado al costo original de esa holgura (que es 0), es directamente y<sub>i</sub>.</li>' +
    '<li><strong>Fórmula general:</strong> y<sub>i</sub> = z<sub>j</sub> − c<sub>j</sub> de la variable que ocupaba inicialmente ' +
    'la posición básica i (holgura, artificial, etc.), independientemente de cuál sea.</li></ol></div>' +
    '<p><strong>Cálculos con la tabla:</strong> la columna que aparece bajo cualquier variable no básica j es B⁻¹a<sub>j</sub>, ' +
    'y su coeficiente en la fila z es z<sub>j</sub> − c<sub>j</sub> = y·a<sub>j</sub> − c<sub>j</sub> (esto es exactamente lo que ' +
    'usa el análisis postóptimo para revisar cambios sin resolver de nuevo desde cero).</p>' +
    '<p><strong>Ejemplo TOYCO.</strong> max z=3x1+2x2+5x3; x1+2x2+x3≤430; 3x1+2x3≤460; x1+4x2≤420. La base óptima es (x2,x3,s3) con ' +
    'B⁻¹ = [[1/2,−1/4,0],[0,1/2,0],[−2,1,1]] y c<sub>B</sub>=(2,5,0). Por el método 1: y = c<sub>B</sub>B⁻¹ = (1,2,0). ' +
    'Por el método 2: los coeficientes z<sub>j</sub>−c<sub>j</sub> bajo s1, s2, s3 son exactamente 1, 2 y 0.</p>' +
    '<div class="callout callout-def"><strong>Dualidad débil y fuerte.</strong> Para cualquier solución factible x del primal ' +
    '(max) y cualquier solución factible y del dual: z(x) ≤ w(y) (dualidad débil). En el óptimo de ambos, z* = w* (dualidad fuerte).</div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> Con B⁻¹ y c<sub>B</sub> de TOYCO, calcule la columna que tendría x1 en la ' +
    'tabla óptima (a<sub>x1</sub> = (1,3,1)) y su costo reducido.</p><details class="solution"><summary>Ver solución</summary>' +
    '<p>B⁻¹a<sub>x1</sub> = (−1/4, 3/2, 2). Costo reducido = y·a<sub>x1</sub> − c<sub>x1</sub> = (1·1+2·3+0·1) − 3 = 7−3 = 4 ≥ 0: ' +
    'confirma que x1 no conviene incorporar (la solución ya es óptima sin ella).</p></details></div>';

  var S3 = '<p>Las variables duales tienen una lectura económica directa: y<sub>i</sub> es el <strong>valor por unidad</strong> ' +
    '(o precio sombra) del recurso i — cuánto aumentaría z si se dispusiera de una unidad más de ese recurso.</p>' +
    '<div class="callout callout-def"><strong>Interpretación en TOYCO</strong> (y1=1, y2=2, y3=0): el recurso 1 vale 1 por unidad, ' +
    'el recurso 2 vale 2 por unidad, y el recurso 3 (y3=0) está <strong>sobrante</strong> (no se usa por completo: 400 de 420 ' +
    'disponibles) — una unidad extra de un recurso abundante no cambia z.</div>' +
    '<p>Las restricciones del dual también tienen sentido económico: para la actividad j, y·a<sub>j</sub> es el ' +
    '<strong>costo de los recursos</strong> que consume, y c<sub>j</sub> es su ingreso. El <strong>costo reducido</strong> ' +
    'es y·a<sub>j</sub> − c<sub>j</sub> (costo de recursos − ingreso).</p>' +
    '<div class="callout callout-tip">«Vale la pena producir» la actividad j si su costo reducido y·a<sub>j</sub> − c<sub>j</sub> ≤ 0 ' +
    '(el ingreso alcanza para pagar los recursos que consume). Si es &gt; 0, no conviene: los recursos rinden más en otro lado.</div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> En TOYCO, ¿por qué x1 no entra en la solución óptima?</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>Porque su costo reducido es 4 &gt; 0: el costo de los recursos ' +
    'que usaría (7 por unidad) supera su ingreso (3 por unidad).</p></details></div>';

  var S4 = '<p>El <strong>simplex dual</strong> resuelve problemas que arrancan <em>óptimos pero no factibles</em> (algún lado ' +
    'derecho negativo), justo lo contrario del simplex normal (que arranca factible pero no óptimo). Es útil cuando ya se tiene ' +
    'una tabla óptima y cambia el lado derecho, volviéndola infactible.</p>' +
    '<div class="callout callout-def"><strong>Algoritmo (simplex dual):</strong>' +
    '<ol><li>Sale de la base la variable con el <strong>lado derecho más negativo</strong>.</li>' +
    '<li>Entre las columnas con coeficiente a<sub>rj</sub> &lt; 0 en esa fila, entra la que minimiza |z<sub>j</sub>−c<sub>j</sub>| / |a<sub>rj</sub>|.</li>' +
    '<li>Se pivotea con Gauss-Jordan igual que en el simplex normal.</li>' +
    '<li>Se repite hasta que todos los lados derechos sean ≥ 0 (óptimo y factible). Si una fila con LD negativo no tiene ningún ' +
    'a<sub>rj</sub> &lt; 0, el problema es <strong>no factible</strong>.</li></ol></div>' +
    '<p><strong>Ejemplo resuelto:</strong> min z = 3x1 + 2x2; 3x1+x2≥3; 4x1+3x2≥6; x1+x2≤3. Convirtiendo las ≥ en ≤ (multiplicando ' +
    'por −1) se arranca con una tabla óptima-pero-infactible; tras dos pivotes (sale s2, entra x2; luego sale s1, entra x1) se ' +
    'llega a x* = (3/5, 6/5), z* = 21/5.</p>' +
    '<div class="widget wide" data-widget="dual-simplex"></div>' +
    '<div class="callout callout-tip"><strong>Simplex generalizado.</strong> Cuando una tabla no es ni óptima ni factible, se ' +
    'alterna entre pasos de simplex dual (para recuperar factibilidad) y simplex primal (para recuperar optimalidad) hasta ' +
    'que ambas condiciones se cumplan.</div>' +
    '<div class="exercise"><p><strong>Ejercicio.</strong> ¿Por qué el simplex dual empieza siendo "óptimo"?</p>' +
    '<details class="solution"><summary>Ver solución</summary><p>Porque se arma la tabla de forma que la fila z ya cumple la ' +
    'condición de optimalidad (todos los z<sub>j</sub>−c<sub>j</sub> ≥ 0 para un problema de maximización interno), aunque algún ' +
    'lado derecho sea negativo (infactible).</p></details></div>';

  var S5 = '<p>El análisis postóptimo estudia qué pasa con la solución óptima cuando cambian los datos del modelo, sin resolver ' +
    'todo desde cero — se reutiliza la tabla óptima y B⁻¹.</p>' +
    '<div class="callout callout-def"><strong>Cambios que afectan la factibilidad</strong> (cambiar b): se recalcula ' +
    'X<sub>B</sub> = B⁻¹b. Si sigue ≥ 0, la solución sigue siendo óptima con los nuevos valores. Si algún componente es negativo, ' +

    for (var i8 = 0; i8 < N; i8++) {
      var j8 = finalMatch.matchRow[i8];
      if (i8 < m && j8 < n) { assign.push({ r: i8, c: j8, cost: costMatrix[i8][j8] }); cost2 += costMatrix[i8][j8]; }
    }
    return { assign: assign, cost: cost2, steps: steps, N: N, m: m, n: n };
  }

  function hungarianSolveMax(profitMatrix) {
    var flat = [];
    profitMatrix.forEach(function (r) { r.forEach(function (v) { flat.push(v); }); });
    var maxVal = Math.max.apply(null, flat);
    var costMatrix = profitMatrix.map(function (r) { return r.map(function (v) { return maxVal - v; }); });
    var res = hungarianSolve(costMatrix);
    var profit = 0;
    res.assign.forEach(function (a) { profit += profitMatrix[a.r][a.c]; });
    res.profit = profit;
    res.maxVal = maxVal;
    return res;
  }

  // Dibuja el ciclo cerrado como SVG superpuesto sobre la tabla de asignación.
  function drawLoopSVG(wrap, tableId, loop) {
    if (!loop || loop.length < 4) return;
    var table = wrap.querySelector('#' + tableId);
    if (!table) return;
    var wrapRect = wrap.getBoundingClientRect();
    var pts = loop.map(function (cell) {
      var td = table.querySelector('td[data-r="' + cell.r + '"][data-c="' + cell.c + '"]');
      if (!td) return null;
      var r = td.getBoundingClientRect();
      return { x: r.left - wrapRect.left + r.width / 2, y: r.top - wrapRect.top + r.height / 2 };
    });
    if (pts.indexOf(null) >= 0) return;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.scrollHeight);
    svg.style.position = 'absolute';
    svg.style.left = '0'; svg.style.top = '0';
    svg.style.pointerEvents = 'none';
    svg.setAttribute('class', 'cap5-loop-svg');
    var d = 'M' + pts.map(function (p) { return p.x + ',' + p.y; }).join(' L');
    d += ' L' + pts[0].x + ',' + pts[0].y;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-dasharray', '6 4');
    svg.appendChild(path);
    pts.forEach(function (p, idx) {
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 4);
      c.setAttribute('fill', idx % 2 === 0 ? 'var(--ok)' : 'var(--err)');
      svg.appendChild(c);
    });
    wrap.appendChild(svg);
  }

  function buildTransportFrames(supply, demand, cost, method) {
    var frames = [];
    var zero = supply.map(function (s) { return demand.map(function () { return 0; }); });
    frames.push({ kind: 'start', alloc: zero, text: 'Matriz balanceada (oferta total = demanda total = ' + sum(supply) + '). Método de inicio: ' + method + '.' });
    var res = method === 'nw' ? nwCorner(supply, demand) : method === 'lc' ? leastCost(supply, demand, cost) : vogel(supply, demand, cost);
    var running = zero.map(function (r) { return r.slice(); });
    res.steps.forEach(function (st) {
      running = running.map(function (r) { return r.slice(); });
      running[st.r][st.c] = st.amount;
      frames.push({ kind: 'init-step', alloc: running.map(function (r) { return r.slice(); }), highlightR: st.r, highlightC: st.c, text: st.note });
    });
    frames.push({ kind: 'init-done', alloc: res.alloc, text: 'Solución inicial completa. Costo = ' + totalCost(res.alloc, cost) + '.' });
    var modi = modiSolve(supply, demand, cost, res.alloc);
    modi.iterations.forEach(function (it, idx) {
      if (it.optimal) {
        var evalTxt = it.evals.map(function (e) { return '(F' + (e.r + 1) + ',D' + (e.c + 1) + ')=' + e.value; }).join(', ');
        frames.push({
          kind: 'modi-optimal', alloc: it.alloc, u: it.u, v: it.v,
          text: 'MODI: u_1=0, multiplicadores u=[' + it.u.join(', ') + '], v=[' + it.v.join(', ') + ']. Evaluaciones de no básicas: ' + (evalTxt || '(ninguna)') + '. Todas ≤ 0 → óptimo. Costo = ' + totalCost(it.alloc, cost) + '.'
        });
      } else {
        var evalTxt2 = it.evals.map(function (e) { return '(F' + (e.r + 1) + ',D' + (e.c + 1) + ')=' + e.value; }).join(', ');
        frames.push({
          kind: 'modi-eval', alloc: it.before, u: it.u, v: it.v,
          text: 'Iteración ' + (idx + 1) + ': u=[' + it.u.join(', ') + '], v=[' + it.v.join(', ') + ']. Evaluaciones: ' + evalTxt2 + '. Entra la celda más positiva: (F' + (it.entering.r + 1) + ',D' + (it.entering.c + 1) + ') con valor ' + it.entering.value + '.'
        });
        frames.push({
          kind: 'modi-loop', alloc: it.before, loop: it.loop, entering: it.entering,
          text: 'Ciclo cerrado desde la celda entrante (signos + y − alternados). θ = mínimo de las celdas «−» = ' + it.theta + '. Sale la celda (F' + (it.leaving.r + 1) + ',D' + (it.leaving.c + 1) + ').'
        });
        frames.push({
          kind: 'modi-applied', alloc: it.after,
          text: 'Nueva tabla tras aplicar θ=' + it.theta + '. Costo = ' + totalCost(it.after, cost) + '.'
        });
      }
    });
    frames.push({ kind: 'final', alloc: modi.alloc, text: 'Solución óptima final. Costo total = ' + modi.cost + '.' });
    return frames;
  }

  function buildHungarianFrames(matrix, mode) {
    var res = mode === 'max' ? hungarianSolveMax(matrix) : hungarianSolve(matrix);
    var frames = [];
    var N = res.N;
    frames.push({ matrix: matrix, note: mode === 'max' ? 'Matriz de beneficios original. Para maximizar se resta cada valor del máximo (' + res.maxVal + ') y se minimiza la matriz resultante.' : 'Matriz de costos original.' });
    res.steps.forEach(function (st) {
      if (st.phase === 'done') {
        var assignTxt = res.assign.map(function (a) { return '(F' + (a.r + 1) + '→C' + (a.c + 1) + ')'; }).join(', ');
        frames.push({ matrix: st.matrix || frames[frames.length - 1].matrix, matchRow: st.matchRow, note: st.note + ' Asignación: ' + assignTxt + '. ' + (mode === 'max' ? 'Beneficio total = ' + res.profit : 'Costo total = ' + res.cost) + '.', done: true });
      } else {
        frames.push({ matrix: st.matrix, rows: st.rows, cols: st.cols, note: st.note, matchRow: st.matchRow });
      }
    });
    return { frames: frames, result: res };
  }

      for (var j2 = 0; j2 < N; j2++) {
        var isZero = frame.matrix[i][j2] === 0;
        var isAssigned = frame.matchRow && frame.matchRow[i] === j2 && frame.done;
        var covered = (frame.rows && frame.rows.indexOf(i) >= 0) || (frame.cols && frame.cols.indexOf(j2) >= 0);
        var cls = [];

        else if (isZero && covered) cls.push('hl');

        h += '<td class="' + cls.join(' ') + '">' + frame.matrix[i][j2] + '</td>';

  var CSS = '' +

  var s1 = '' +
    '<p>El <b>modelo de transporte</b> es un caso especial de programación lineal donde se busca la forma más ' +

    '<p>Muchos problemas que no parecen de transporte a primera vista se pueden <b>modelar como tales</b>, ' +

    '<div class="callout callout-def"><b>Producción–inventario como transporte.</b> Cada <b>período de producción</b> ' +

    '<p class="muted">5.3.3 — Los multiplicadores u<sub>i</sub>, v<sub>j</sub> son exactamente las variables duales del ' +

  <script>
/* Programación entera y binaria — Unidad III del programa y ítem de examen.
 * Taha 9ª ed. cap. 9 (fuera de 1–5, pero el límite del curso son los exámenes). */
(function (global) {
  'use strict';
  var IO = global.IO = global.IO || { chapters: [] };
  IO.registerChapter = IO.registerChapter || function (ch) { IO.chapters.push(ch); };

  function video(id, title, dur, lang, why) {
    return IO.Teach ? IO.Teach.videoCard({ id: id, title: title, dur: dur, lang: lang, why: why }) : '';
  }
  function refs(list) { return IO.Teach ? IO.Teach.refsHtml(list) : ''; }
  function viz(name, cap) { return IO.Teach ? IO.Teach.vizHtml(name, cap) : '<div class="widget" data-viz3d="' + name + '"></div>'; }

  var PROJECTS = [
    { name: '1', g: 1.0, c: 6 },
    { name: '2', g: 1.8, c: 12 },
    { name: '3', g: 1.6, c: 10 },
    { name: '4', g: 0.8, c: 4 },
    { name: '5', g: 1.4, c: 8 }
  ];
  var BUDGET = 20;

  function knapsackBest(projects, budget) {
    var n = projects.length;
    var best = { z: -1, x: [], cap: 0 };
    var lim = 1 << n;
    for (var mask = 0; mask < lim; mask++) {
      var z = 0, cap = 0, x = [];
      for (var j = 0; j < n; j++) {
        var on = (mask >> j) & 1;
        x.push(on);
        if (on) { z += projects[j].g; cap += projects[j].c; }
      }
      if (cap <= budget && z > best.z) best = { z: z, x: x, cap: cap };
    }
    return best;
  }

  function s1() {

  function s2() {

  function s3() {
    return '<div class="zero-hero">' +
      '<p><strong>De cero. Cómo se escribe en Excel</strong> (lo piden con puntos).</p>' +

  function mountEnum(root) {

    h += '<div class="table-scroll"><table class="data"><thead><tr><th>x1</th><th>x2</th><th>x3</th><th>x4</th><th>x5</th><th>Capital</th><th>Z</th><th></th></tr></thead><tbody>';
    var n = PROJECTS.length;
    var lim = 1 << n;
    var rows = [];
    var mask;
    for (mask = 0; mask < lim; mask++) {
      var x = [], cap = 0, z = 0, j;

    rows.sort(function (a, b) { return b.z - a.z; });

    });
    h += '</tbody></table></div>';
    h += '<p><strong>Óptimo:</strong> proyectos 1, 3 y 4. Capital ' + best.cap + '. Ganancia <span class="eq">' + best.z + '</span>.</p>';
    el.innerHTML = h;
  }

  IO.registerChapter({

      { q: 'En Peterson & Johnson el presupuesto es 20 y el óptimo usa los proyectos:', options: ['2 y 5', '1, 3 y 4', '1, 4 y 5', '3 y 5'], answer: 1, explain: '1+3+4: capital 20, ganancia 3,4. Es la mejor.' },
      { q: 'La ganancia óptima de Peterson & Johnson es:', type: 'number', answer: 3.4, tol: 0.05, explain: '1 + 1,6 + 0,8 = 3,4.' },
      { q: 'Redondear el óptimo del PL relajado:', options: ['siempre da el óptimo entero', 'puede ser ilegal o subóptimo', 'es obligatorio en PEB', 'elimina las restricciones'], answer: 1, explain: 'Really Big Shoe: 26,32 no es un equipo. Hay que buscar enteros factibles.' },
      { q: 'En Solver, para PEB, las celdas cambiantes se marcan como:', options: ['continuas', 'binarias (bin)', 'no negativas nada más', 'libres'], answer: 1, explain: 'Restricción “binario” sobre x1…x5.' },
      { q: 'La relajación lineal de un PEB es:', options: ['el mismo modelo con 0 ≤ xj ≤ 1', 'borrar el objetivo', 'poner M en la diagonal', 'el dual'], answer: 0, explain: 'Se suelta la integralidad: 0 ≤ xj ≤ 1. Da una cota superior (en un max).' },
      { q: 'Si el proyecto 2 solo se puede hacer si se hace el 1, la restricción es:', options: ['x1 + x2 ≤ 1', 'x2 ≤ x1', 'x1 ≤ x2', 'x1 = x2'], answer: 1, explain: 'x2 ≤ x1: si x2=1 entonces x1 debe ser 1.' },
      { q: '¿Cuántas combinaciones binarias hay con 5 proyectos?', options: ['5', '10', '16', '32'], answer: 3, explain: '2^5 = 32. Por eso se puede enumerar a mano o con una tabla.' },
      { q: 'En Really Big Shoe el óptimo entero de equipos totales es:', type: 'number', answer: 38, tol: 0.1, explain: '26 de básquetbol + 12 de fútbol = 38. 39 no es factible.' },
      { q: 'PEB es un caso particular de:', options: ['teoría de colas', 'programación lineal entera', 'simulación', 'flujo máximo'], answer: 1, explain: 'Entera + dominio {0,1} = PEB.' }
    ]
  });

  IO.__peb = { knapsackBest: knapsackBest, PROJECTS: PROJECTS, BUDGET: BUDGET };
